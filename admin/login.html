<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Sujata Institute ERP</title>
  <link rel="icon" href="../assets/img/logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08080c;
      --card-bg: rgba(24, 24, 34, 0.92);
      --card-border-off: rgba(100, 100, 120, 0.4);
      --card-border-on: rgba(255, 190, 70, 0.75);
      --accent: #ffb84d;
      --accent-soft: rgba(255, 184, 77, 0.28);
      --glow-success: #34d399;
      --text: #f5f5f8;
      --text-muted: #a0a4b0;
      --input-bg: rgba(12, 12, 20, 0.85);
      --input-border: rgba(110, 110, 130, 0.45);
      --lamp-shade-off: #2c2c38;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      height: 100%; margin: 0;
      font-family: 'Poppins', system-ui, sans-serif;
      background: var(--bg); color: var(--text); overflow-x: hidden;
    }
    .login-page {
      min-height: 100vh; position: relative;
      background:
        radial-gradient(ellipse 80% 50% at 20% 45%, rgba(40, 25, 10, 0.35) 0%, transparent 55%),
        radial-gradient(ellipse at center, #0e0e14 0%, #08080c 100%);
      transition: background 0.8s var(--ease-out);
    }
    .login-page.lamp-on {
      background:
        radial-gradient(ellipse 70% 55% at 22% 42%, rgba(255, 170, 50, 0.14) 0%, transparent 50%),
        radial-gradient(ellipse at center, #12121a 0%, #08080c 100%);
    }
    .ambient-glow {
      position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 0;
      background: radial-gradient(circle at 22% 42%, rgba(255, 175, 55, 0.1), transparent 42%);
      transition: opacity 0.7s var(--ease-out);
    }
    .login-page.lamp-on .ambient-glow { opacity: 1; }
    .lamp-col, .form-col { position: relative; z-index: 2; padding: 1.5rem 1rem; }

    .lamp-scene {
      position: relative; width: 260px; height: 400px;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      animation: float 4.5s ease-in-out infinite;
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .login-page.lamp-on .lamp-scene { animation-duration: 5.5s; }

    .light-cone {
      position: absolute; bottom: 65px; left: 50%;
      transform: translateX(-50%) scaleY(0); width: 200px; height: 180px;
      background: linear-gradient(to bottom, rgba(255,200,80,0.38) 0%, rgba(255,180,50,0.14) 40%, transparent 100%);
      clip-path: polygon(36% 0%, 64% 0%, 100% 100%, 0% 100%);
      opacity: 0; pointer-events: none; filter: blur(2px); z-index: 1;
      transition: opacity 0.6s var(--ease-out), transform 0.7s var(--ease-out);
      transform-origin: top center;
    }
    .login-page.lamp-on .light-cone { opacity: 1; transform: translateX(-50%) scaleY(1); }
    .floor-glow {
      position: absolute; bottom: 8px; left: 50%;
      transform: translateX(-50%) scale(0.3); width: 150px; height: 36px;
      background: radial-gradient(ellipse, rgba(255,180,60,0.4), transparent 70%);
      border-radius: 50%; opacity: 0; z-index: 0;
      transition: opacity 0.6s, transform 0.7s var(--ease-out);
    }
    .login-page.lamp-on .floor-glow { opacity: 1; transform: translateX(-50%) scale(1); }

    .lamp {
      position: relative; z-index: 3;
      display: flex; flex-direction: column; align-items: center;
      transition: transform 0.4s var(--ease-bounce);
    }
    .login-page.lamp-on .lamp { animation: lampBounce 0.55s var(--ease-bounce); }
    @keyframes lampBounce {
      0%{transform:translateY(0) scale(1)} 30%{transform:translateY(-7px) scale(1.03)}
      60%{transform:translateY(2px) scale(0.98)} 100%{transform:translateY(0) scale(1)}
    }

    .lamp-shade { position: relative; width: 130px; z-index: 5; }
    .shade-top {
      width: 46px; height: 11px; background: #1c1c26;
      border-radius: 6px 6px 0 0; margin: 0 auto; transition: background 0.5s;
    }
    .login-page.lamp-on .shade-top { background: #3d2e12; }
    .shade-body {
      width: 130px; height: 84px; background: var(--lamp-shade-off);
      border-radius: 8px 8px 40% 40% / 8px 8px 55% 55%;
      position: relative; display: flex; align-items: center; justify-content: center;
      transition: background 0.65s var(--ease-out), box-shadow 0.65s var(--ease-out), filter 0.65s;
      box-shadow: inset 0 -8px 18px rgba(0,0,0,0.45), 0 4px 12px rgba(0,0,0,0.35);
    }
    .login-page.lamp-on .shade-body {
      background: linear-gradient(180deg, #ffe48f 0%, #f0b040 45%, #e09020 100%);
      box-shadow: inset 0 -6px 16px rgba(255,200,80,0.3), 0 0 28px rgba(255,180,50,0.5),
                  0 0 55px rgba(255,160,40,0.22), 0 8px 22px rgba(0,0,0,0.25);
      filter: brightness(1.06);
    }
    .shade-bottom {
      width: 112px; height: 7px; background: #1c1c26;
      border-radius: 0 0 50% 50%; margin: -2px auto 0;
      transition: background 0.5s, box-shadow 0.5s;
    }
    .login-page.lamp-on .shade-bottom {
      background: #c07820; box-shadow: 0 4px 18px rgba(255,180,50,0.45);
    }

    .lamp-face {
      position: relative; width: 64px; height: 46px;
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0 9px;
    }
    .eye {
      width: 16px; height: 16px; background: #1a1a22; border-radius: 50%;
      position: relative; overflow: hidden;
      transition: height 0.35s var(--ease-out), background 0.4s;
    }
    .login-page:not(.lamp-on) .eye {
      height: 3.5px; background: #1a1a22; border-radius: 2px; margin-top: 5px;
    }
    .login-page:not(.lamp-on) .pupil, .login-page:not(.lamp-on) .eyelid { opacity: 0; }
    .login-page.lamp-on .eye {
      height: 16px; background: #fff; box-shadow: inset 0 0 4px rgba(0,0,0,0.12);
    }
    .pupil {
      position: absolute; width: 7px; height: 7px; background: #1a1a22; border-radius: 50%;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      transition: transform 0.25s var(--ease-out), left 0.25s, top 0.25s; opacity: 1;
    }
    .eyelid {
      position: absolute; top: 0; left: 0; right: 0; height: 0;
      background: #f0b040; transition: height 0.2s; opacity: 1;
    }
    .login-page.looking-form .pupil { left: 64%; top: 48%; }
    .login-page.looking-password .pupil { left: 68%; top: 54%; width: 8px; height: 8px; }
    .mouth {
      width: 20px; height: 3.5px; background: #1a1a22;
      border-radius: 0 0 10px 10px; margin-top: 2px;
      transition: all 0.35s var(--ease-out); opacity: 0.55;
    }
    .login-page:not(.lamp-on) .mouth { width: 14px; height: 2.5px; border-radius: 3px; opacity: 0.45; }
    .login-page.lamp-on .mouth {
      width: 22px; height: 11px; border-radius: 0 0 12px 12px; background: #1a1a22; opacity: 1;
    }
    .login-page.happy .mouth { width: 26px; height: 13px; border-radius: 0 0 14px 14px; }
    .blush {
      position: absolute; width: 11px; height: 7px;
      background: rgba(255,120,100,0.5); border-radius: 50%; top: 26px;
      opacity: 0; transition: opacity 0.4s;
    }
    .left-blush { left: 1px; } .right-blush { right: 1px; }
    .login-page.lamp-on .blush { opacity: 1; }

    .lamp-arm {
      display: flex; flex-direction: column; align-items: center; margin-top: -3px; z-index: 4;
    }
    .arm-joint {
      width: 16px; height: 16px; background: #3a3a48; border-radius: 50%;
      border: 3px solid #252530; box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }
    .arm-segment {
      width: 11px; height: 64px;
      background: linear-gradient(90deg, #2e2e3a, #3a3a48, #2e2e3a);
      border-radius: 5px; margin-top: -3px; box-shadow: inset 0 0 4px rgba(0,0,0,0.3);
    }
    .lamp-base { margin-top: -2px; z-index: 3; }
    .base-top {
      width: 46px; height: 12px; background: #2a2a35;
      border-radius: 4px 4px 0 0; margin: 0 auto;
    }
    .base-bottom {
      width: 84px; height: 16px;
      background: linear-gradient(180deg, #2a2a35, #1e1e28);
      border-radius: 4px 4px 10px 10px; box-shadow: 0 5px 14px rgba(0,0,0,0.4);
    }

    .cord-wrapper {
      position: absolute; top: 88px; right: -6px; z-index: 12;
      cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none;
    }
    .cord-wrapper:active { cursor: grabbing; }
    .cord {
      display: flex; flex-direction: column; align-items: center;
      transform-origin: top center; transition: transform 0.15s ease-out;
    }
    .cord-line {
      width: 3px; height: 50px;
      background: linear-gradient(180deg, #7a6548, #a08858);
      border-radius: 2px; box-shadow: 1px 0 2px rgba(0,0,0,0.35);
      transition: height 0.15s ease-out;
    }
    .cord-handle {
      margin-top: -2px; padding: 10px; margin: -10px;
      display: flex; justify-content: center; position: relative;
    }
    .handle-ball {
      width: 24px; height: 24px;
      background: radial-gradient(circle at 35% 30%, #f0e0b8, #c9a66a 55%, #8a6e40);
      border-radius: 50%;
      box-shadow: 0 3px 10px rgba(0,0,0,0.4), inset 0 1px 3px rgba(255,255,255,0.35);
      transition: transform 0.15s, box-shadow 0.3s;
    }
    .cord-wrapper:hover .handle-ball {
      transform: scale(1.12);
      box-shadow: 0 0 14px rgba(255,190,80,0.55), 0 3px 10px rgba(0,0,0,0.35);
    }
    .cord.pulling .cord-line { height: 72px; }
    .cord.pulling { transform: translateY(11px) rotate(2deg); }
    .cord.bounce { animation: cordBounce 0.55s var(--ease-bounce); }
    @keyframes cordBounce {
      0%{transform:translateY(11px) rotate(2deg)} 25%{transform:translateY(-5px) rotate(-3deg)}
      50%{transform:translateY(3px) rotate(1.5deg)} 75%{transform:translateY(-2px) rotate(-1deg)}
      100%{transform:translateY(0) rotate(0)}
    }

    /* Clear "Pull me" badge for new users */
    .pull-hint {
      position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
      margin-top: 10px; white-space: nowrap;
      background: linear-gradient(135deg, #ffb84d, #e09020);
      color: #1a1208; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
      padding: 0.35rem 0.75rem; border-radius: 999px;
      box-shadow: 0 4px 14px rgba(255,170,50,0.45);
      pointer-events: none; animation: hintPulse 1.6s ease-in-out infinite; z-index: 15;
    }
    .pull-hint i { margin-right: 4px; font-size: 0.7rem; }
    .login-page.lamp-on .pull-hint {
      opacity: 0; visibility: hidden; transition: opacity 0.4s, visibility 0.4s;
    }
    @keyframes hintPulse {
      0%,100%{transform:translateX(-50%) scale(1); box-shadow:0 4px 14px rgba(255,170,50,0.45)}
      50%{transform:translateX(-50%) scale(1.06); box-shadow:0 6px 20px rgba(255,170,50,0.6)}
    }
    .pull-hint::before {
      content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
      border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-bottom: 6px solid #ffb84d;
    }

    .login-card {
      width: 100%; max-width: 400px;
      background: var(--card-bg);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border-off); border-radius: 18px;
      padding: 1.75rem 1.6rem;
      box-shadow: 0 6px 28px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
      transform: scale(0.98); opacity: 0.78;
      transition: border-color 0.65s var(--ease-out), box-shadow 0.65s var(--ease-out),
                  transform 0.55s var(--ease-bounce), opacity 0.55s var(--ease-out), filter 0.55s;
      filter: brightness(0.88);
    }
    .login-page.lamp-on .login-card {
      border-color: var(--card-border-on);
      box-shadow: 0 0 0 1px rgba(255,184,77,0.2), 0 0 30px rgba(255,175,55,0.2),
                  0 0 60px rgba(255,150,40,0.1), 0 12px 36px rgba(0,0,0,0.45),
                  inset 0 1px 0 rgba(255,255,255,0.06);
      transform: scale(1); opacity: 1; filter: brightness(1);
      animation: cardRise 0.6s var(--ease-bounce);
    }
    @keyframes cardRise {
      0%{transform:scale(0.97) translateY(8px)} 60%{transform:scale(1.012) translateY(-3px)}
      100%{transform:scale(1) translateY(0)}
    }
    .login-page.lamp-on.focus-strong .login-card {
      box-shadow: 0 0 0 1px rgba(255,184,77,0.3), 0 0 38px rgba(255,175,55,0.28),
                  0 0 70px rgba(255,150,40,0.12), 0 12px 36px rgba(0,0,0,0.45);
    }
    .login-page.success .login-card {
      border-color: rgba(52,211,153,0.75);
      box-shadow: 0 0 0 1px rgba(52,211,153,0.3), 0 0 40px rgba(52,211,153,0.22),
                  0 0 75px rgba(52,211,153,0.1), 0 12px 36px rgba(0,0,0,0.45);
    }

    /* Logo clear on white pill */
    .logo-wrap { text-align: center; margin-bottom: 1.1rem; }
    .logo-wrap a {
      display: inline-block; padding: 0.5rem 0.85rem;
      background: rgba(255,255,255,0.97); border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      transition: box-shadow 0.4s, transform 0.3s;
    }
    .logo-wrap a:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
    .logo-wrap img {
      display: block; max-height: 52px; width: auto; max-width: 160px; object-fit: contain;
    }
    .login-page.lamp-on .logo-wrap a {
      box-shadow: 0 0 0 2px rgba(255,184,77,0.45), 0 4px 18px rgba(255,170,50,0.25);
    }

    .welcome-title {
      font-size: 1.5rem; font-weight: 700; margin-bottom: 0.15rem;
      letter-spacing: -0.02em; color: var(--text); text-align: center;
    }
    .welcome-sub {
      color: var(--text-muted); font-size: 0.86rem; margin-bottom: 1.25rem; text-align: center;
    }
    .form-label { font-size: 0.78rem; font-weight: 500; color: var(--text-muted); margin-bottom: 0.3rem; }
    .input-wrapper { position: relative; }
    .input-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      color: #7a7e8c; font-size: 0.88rem; pointer-events: none; transition: color 0.25s; z-index: 2;
    }
    .login-input {
      background: var(--input-bg) !important; border: 1px solid var(--input-border) !important;
      border-radius: 11px !important; color: var(--text) !important;
      padding: 0.68rem 1rem 0.68rem 2.4rem !important; font-size: 0.92rem;
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s !important;
    }
    .login-input::placeholder { color: #6b7080; }
    .login-input:focus {
      background: rgba(18,18,26,0.95) !important; border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px var(--accent-soft) !important; outline: none !important;
    }
    .input-wrapper:focus-within .input-icon { color: var(--accent); }
    .toggle-password {
      position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: #7a7e8c; cursor: pointer;
      padding: 4px; font-size: 0.92rem; transition: color 0.2s; z-index: 2;
    }
    .toggle-password:hover { color: var(--accent); }
    .form-check-input { background-color: var(--input-bg); border-color: var(--input-border); }
    .form-check-input:checked { background-color: var(--accent); border-color: var(--accent); }
    .form-check-label { font-size: 0.82rem; color: var(--text-muted); }
    .hint-text { font-size: 0.72rem; color: #6b7080; margin-top: 0.3rem; }

    .btn-login {
      background: linear-gradient(135deg, #454555, #353545); border: none; border-radius: 11px;
      padding: 0.75rem 1.4rem; font-weight: 600; font-size: 0.92rem; letter-spacing: 0.03em;
      color: #b0b0c0;
      transition: background 0.4s, color 0.4s, transform 0.25s var(--ease-out), box-shadow 0.3s;
      position: relative; overflow: hidden;
    }
    .login-page:not(.lamp-on) .btn-login {
      background: linear-gradient(135deg, #353545, #2a2a38); color: #787888;
      box-shadow: none; cursor: default; pointer-events: none;
    }
    .login-page.lamp-on .btn-login {
      background: linear-gradient(135deg, #f0a830, #e09020); color: #1a1208;
      box-shadow: 0 4px 16px rgba(240,160,40,0.4); pointer-events: auto; cursor: pointer;
    }
    .login-page.lamp-on .btn-login:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 22px rgba(240,160,40,0.5);
      background: linear-gradient(135deg, #ffb840, #f0a020); color: #1a1208;
    }
    .login-page.lamp-on .btn-login:active { transform: translateY(1px) scale(0.98); }
    .btn-login.loading .btn-text { opacity: 0; }
    .btn-login.loading .btn-loader {
      display: inline-block !important; position: absolute;
      left: 50%; top: 50%; transform: translate(-50%,-50%);
    }
    .btn-login.success-state {
      background: linear-gradient(135deg, #34d399, #10b981) !important;
      color: #06281e !important; box-shadow: 0 4px 18px rgba(52,211,153,0.4) !important;
    }
    .success-msg {
      text-align: center; margin-top: 0.9rem; font-weight: 600;
      color: var(--glow-success); font-size: 1rem; animation: fadeInUp 0.45s var(--ease-out);
    }
    @keyframes fadeInUp {
      from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)}
    }
    .footer-note { font-size: 0.78rem; color: var(--text-muted); text-align: center; margin-top: 1.15rem; }
    .demo-note { font-size: 0.72rem; color: #6b7080; text-align: center; margin-top: 0.4rem; }
    .alert-box { border-radius: 10px; font-size: 0.85rem; padding: 0.6rem 0.85rem; margin-bottom: 0.9rem; }
    .particles { position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
    .particle {
      position: absolute; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); opacity: 0; animation: sparkle 1.4s ease-out forwards;
    }
    @keyframes sparkle {
      0%{opacity:1;transform:translate(0,0) scale(1)}
      100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}
    }

    @media (max-width: 991.98px) {
      .lamp-scene { width: 200px; height: 320px; margin-bottom: 0.25rem; }
      .shade-body { width: 100px; height: 66px; }
      .lamp-shade { width: 100px; }
      .arm-segment { height: 50px; }
      .cord-wrapper { top: 72px; right: -4px; }
      .cord-line { height: 42px; }
      .pull-hint { font-size: 0.68rem; padding: 0.3rem 0.65rem; margin-top: 8px; }
      .login-card { max-width: 380px; padding: 1.5rem 1.35rem; }
      .logo-wrap img { max-height: 48px; max-width: 140px; }
    }
    @media (max-width: 575.98px) {
      .lamp-col { padding-top: 1.25rem; padding-bottom: 0.25rem; }
      .form-col { padding-top: 0.35rem; padding-bottom: 1.75rem; }
      .lamp-scene { width: 160px; height: 260px; }
      .shade-body { width: 88px; height: 56px; }
      .lamp-shade { width: 88px; }
      .lamp-face { width: 52px; height: 38px; }
      .eye { width: 13px; height: 13px; }
      .login-page:not(.lamp-on) .eye { height: 3px; }
      .arm-segment { height: 40px; }
      .base-bottom { width: 64px; }
      .cord-wrapper { top: 62px; }
      .cord-line { height: 34px; }
      .handle-ball { width: 20px; height: 20px; }
      .pull-hint { font-size: 0.65rem; padding: 0.28rem 0.55rem; margin-top: 6px; }
      .welcome-title { font-size: 1.35rem; }
      .login-card { padding: 1.35rem 1.15rem; }
      .logo-wrap img { max-height: 44px; max-width: 130px; }
      .logo-wrap a { padding: 0.4rem 0.7rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .lamp-scene, .pull-hint { animation: none; }
      .cord.bounce, .login-page.lamp-on .lamp, .login-page.lamp-on .login-card { animation: none; }
    }
  </style>
</head>
<body>
  <div class="login-page" id="loginPage">
    <div class="ambient-glow"></div>
    <div class="particles" id="particles"></div>
    <div class="container-fluid h-100">
      <div class="row h-100 align-items-center justify-content-center g-0">
        <div class="col-12 col-lg-5 d-flex justify-content-center align-items-center lamp-col">
          <div class="lamp-scene" id="lampScene">
            <div class="light-cone"></div>
            <div class="lamp" id="lamp">
              <div class="lamp-shade">
                <div class="shade-top"></div>
                <div class="shade-body">
                  <div class="lamp-face">
                    <div class="eye left-eye"><div class="pupil"></div><div class="eyelid"></div></div>
                    <div class="eye right-eye"><div class="pupil"></div><div class="eyelid"></div></div>
                    <div class="mouth"></div>
                    <div class="blush left-blush"></div>
                    <div class="blush right-blush"></div>
                  </div>
                </div>
                <div class="shade-bottom"></div>
              </div>
              <div class="lamp-arm">
                <div class="arm-joint"></div>
                <div class="arm-segment"></div>
              </div>
              <div class="lamp-base">
                <div class="base-top"></div>
                <div class="base-bottom"></div>
              </div>
              <div class="cord-wrapper" id="cordWrapper" tabindex="0" role="button" aria-label="Pull the cord to turn the lamp on">
                <div class="cord" id="cord">
                  <div class="cord-line"></div>
                  <div class="cord-handle" title="Pull me to turn on">
                    <div class="handle-ball"></div>
                  </div>
                </div>
                <div class="pull-hint" id="pullHint">
                  <i class="fas fa-hand-pointer"></i> Pull me
                </div>
              </div>
            </div>
            <div class="floor-glow"></div>
          </div>
        </div>
        <div class="col-12 col-lg-6 col-xl-5 d-flex justify-content-center align-items-center form-col">
          <div class="login-card" id="loginCard">
            <div class="logo-wrap">
              <a href="../public/index.html" title="Back to website">
                <img src="../assets/img/logo.png" alt="Sujata Institute Logo">
              </a>
            </div>
            <h1 class="welcome-title">Welcome Back</h1>
            <p class="welcome-sub">Sign in to Sujata Institute ERP</p>
            <div id="alertBox" class="alert alert-box d-none" role="alert"></div>
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label class="form-label" for="email">Email Address</label>
                <div class="input-wrapper">
                  <i class="fas fa-envelope input-icon"></i>
                  <input type="email" class="form-control login-input" id="email" placeholder="admin@sujatainstitute.com" autocomplete="email" required>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrapper">
                  <i class="fas fa-lock input-icon"></i>
                  <input type="password" class="form-control login-input" id="password" placeholder="Enter password" autocomplete="current-password" required>
                  <button type="button" class="toggle-password" id="togglePass" aria-label="Show password">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                  </button>
                </div>
              </div>
              <div class="mb-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="remember">
                  <label class="form-check-label" for="remember">Remember me</label>
                </div>
                <p class="hint-text mb-0">Password can only be changed by Super Admin / Institute Admin from Users.</p>
              </div>
              <button type="submit" class="btn btn-login w-100" id="loginBtn">
                <span class="btn-text"><i class="fas fa-sign-in-alt me-2"></i>Sign In</span>
                <span class="btn-loader d-none"><span class="spinner-border spinner-border-sm" role="status"></span></span>
              </button>
              <div class="success-msg d-none" id="successMsg">Welcome back! &#10024;</div>
            </form>
            <p class="footer-note mb-0">After login you are taken to your role home (Admin, Trainer, Student, &#8230;).</p>
            <p class="demo-note mb-0">Demo: admin@sujatainstitute.com / admin123</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/rbac.js"></script>
  <script>
  (function () {
    'use strict';
    const page = document.getElementById('loginPage');
    const cordWrapper = document.getElementById('cordWrapper');
    const cord = document.getElementById('cord');
    const loginCard = document.getElementById('loginCard');
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const togglePass = document.getElementById('togglePass');
    const eyeIcon = document.getElementById('eyeIcon');
    const successMsg = document.getElementById('successMsg');
    const alertBox = document.getElementById('alertBox');
    const particlesEl = document.getElementById('particles');
    let lampOn = false, isPulling = false, isAnimating = false, startY = 0, pullDistance = 0;

    function startPull(clientY) {
      if (isAnimating) return;
      isPulling = true; startY = clientY; pullDistance = 0;
      cord.classList.remove('bounce'); cord.classList.add('pulling');
    }
    function movePull(clientY) {
      if (!isPulling) return;
      pullDistance = Math.max(0, Math.min(80, clientY - startY));
    }
    function endPull() {
      if (!isPulling) return;
      isPulling = false; cord.classList.remove('pulling'); cord.classList.add('bounce');
      if (pullDistance > 18 || pullDistance < 5) toggleLamp();
      setTimeout(function(){ cord.classList.remove('bounce'); }, 600);
    }
    cordWrapper.addEventListener('mousedown', function(e){ e.preventDefault(); startPull(e.clientY); });
    window.addEventListener('mousemove', function(e){ if (isPulling) movePull(e.clientY); });
    window.addEventListener('mouseup', endPull);
    cordWrapper.addEventListener('touchstart', function(e){ e.preventDefault(); startPull(e.touches[0].clientY); }, {passive:false});
    window.addEventListener('touchmove', function(e){ if (!isPulling) return; movePull(e.touches[0].clientY); }, {passive:true});
    window.addEventListener('touchend', endPull);
    window.addEventListener('touchcancel', endPull);
    cordWrapper.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (!isAnimating) {
          cord.classList.add('pulling');
          setTimeout(function(){
            cord.classList.remove('pulling'); cord.classList.add('bounce');
            toggleLamp(); setTimeout(function(){ cord.classList.remove('bounce'); }, 600);
          }, 180);
        }
      }
    });

    function toggleLamp() {
      if (isAnimating) return;
      isAnimating = true; lampOn = !lampOn;
      if (lampOn) {
        page.classList.add('lamp-on');
        page.classList.remove('happy','looking-form','looking-password','focus-strong','success');
      } else {
        page.classList.remove('lamp-on','happy','looking-form','looking-password','focus-strong','success');
        successMsg.classList.add('d-none');
        loginBtn.classList.remove('loading','success-state');
        loginBtn.querySelector('.btn-text').innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Sign In';
        loginBtn.querySelector('.btn-loader').classList.add('d-none');
        loginBtn.disabled = false;
      }
      setTimeout(function(){ isAnimating = false; }, 700);
    }

    function onFocus(isPassword) {
      if (!lampOn) return;
      page.classList.add('looking-form','focus-strong');
      if (isPassword) page.classList.add('looking-password');
      else page.classList.remove('looking-password');
    }
    function onBlur() {
      setTimeout(function(){
        if (document.activeElement !== emailInput && document.activeElement !== passwordInput) {
          page.classList.remove('looking-form','looking-password','focus-strong');
        }
      }, 80);
    }
    emailInput.addEventListener('focus', function(){ onFocus(false); });
    passwordInput.addEventListener('focus', function(){ onFocus(true); });
    emailInput.addEventListener('blur', onBlur);
    passwordInput.addEventListener('blur', onBlur);

    togglePass.addEventListener('click', function(){
      var hidden = passwordInput.type === 'password';
      passwordInput.type = hidden ? 'text' : 'password';
      eyeIcon.classList.toggle('fa-eye', !hidden);
      eyeIcon.classList.toggle('fa-eye-slash', hidden);
    });

    function landingForRole(roleName) {
      var full = ['Super Admin','Institute Admin','Accounts','Placement Officer'];
      if (full.indexOf(roleName) !== -1) return 'dashboard.html';
      if (window.RBAC && RBAC.ROLE_ACCESS && RBAC.ROLE_ACCESS[roleName]) {
        return RBAC.ROLE_ACCESS[roleName].landing || 'dashboard.html';
      }
      return 'dashboard.html';
    }
    function goToRoleHome() {
      var s = SIIT.Session.get();
      var role = (s && s.role_name) || '';
      window.location.href = landingForRole(role);
    }

    function spawnParticles() {
      var count = 28;
      var rect = loginCard.getBoundingClientRect();
      var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
      var lampRect = document.getElementById('lampScene').getBoundingClientRect();
      var lx = lampRect.left + lampRect.width / 2, ly = lampRect.top + lampRect.height * 0.35;
      for (var i = 0; i < count; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        var fromLamp = i % 3 === 0;
        var ox = fromLamp ? lx : cx, oy = fromLamp ? ly : cy;
        var angle = Math.random() * Math.PI * 2, dist = 40 + Math.random() * 120;
        p.style.left = ox + 'px'; p.style.top = oy + 'px';
        p.style.setProperty('--tx', (Math.cos(angle) * dist) + 'px');
        p.style.setProperty('--ty', (Math.sin(angle) * dist - 30) + 'px');
        p.style.background = fromLamp
          ? 'hsl(' + (35 + Math.random() * 25) + ',90%,60%)'
          : 'hsl(' + (150 + Math.random() * 40) + ',70%,55%)';
        p.style.width = p.style.height = (4 + Math.random() * 5) + 'px';
        p.style.animationDelay = (Math.random() * 0.25) + 's';
        p.style.animationDuration = (1 + Math.random() * 0.6) + 's';
        particlesEl.appendChild(p);
        (function(el){ setTimeout(function(){ el.remove(); }, 2000); })(p);
      }
    }

    loginForm.addEventListener('submit', async function(e){
      e.preventDefault();
      if (!lampOn) return;
      var email = emailInput.value.trim(), password = passwordInput.value;
      if (!email || !password) {
        loginCard.style.animation = 'none';
        void loginCard.offsetWidth;
        loginCard.style.animation = 'cardRise 0.4s ease';
        return;
      }
      loginBtn.classList.add('loading');
      loginBtn.querySelector('.btn-loader').classList.remove('d-none');
      loginBtn.disabled = true;
      alertBox.classList.add('d-none');
      try {
        var session = await SIIT.loginUser(email, password);
        var role = session.role_name || '';
        loginBtn.classList.remove('loading');
        loginBtn.querySelector('.btn-loader').classList.add('d-none');
        loginBtn.classList.add('success-state');
        loginBtn.querySelector('.btn-text').textContent = 'SUCCESS';
        loginBtn.disabled = false;
        page.classList.add('happy','success');
        successMsg.classList.remove('d-none');
        successMsg.textContent = 'Welcome' + (role ? ' (' + role + ')' : '') + '! \u2728';
        spawnParticles();
        setTimeout(goToRoleHome, 900);
      } catch (err) {
        loginBtn.classList.remove('loading');
        loginBtn.querySelector('.btn-loader').classList.add('d-none');
        loginBtn.disabled = false;
        loginBtn.querySelector('.btn-text').innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Sign In';
        alertBox.className = 'alert alert-danger alert-box';
        alertBox.textContent = err.message || 'Login failed';
        alertBox.classList.remove('d-none');
      }
    });

    if (typeof SIIT !== 'undefined' && SIIT.Session && SIIT.Session.isLoggedIn()) {
      goToRoleHome();
    }
  })();
  </script>
</body>
</html>
